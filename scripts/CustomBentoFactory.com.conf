# Custom Bento Factory - Enterprise Nginx Architecture
# HTTP/2, 301 Apex Canonicalization, Custom 404, Fast Clean URLs, Security Headers, RFQ API Reverse Proxy

# 1. HTTP Port 80 - Redirect all requests to HTTPS www.custombentofactory.com
server {
    listen 80;
    listen [::]:80;
    server_name www.custombentofactory.com custombentofactory.com;

    # Allow Let's Encrypt validation tokens over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/CustomBentoFactory.com;
    }

    location / {
        return 301 https://www.custombentofactory.com$request_uri;
    }
}

# 2. HTTPS Port 443 - Apex Domain Redirect (custombentofactory.com -> www.custombentofactory.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name custombentofactory.com;

    ssl_certificate /etc/letsencrypt/live/www.custombentofactory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.custombentofactory.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.custombentofactory.com$request_uri;
}

# 3. HTTPS Port 443 - Main Production Server (www.custombentofactory.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.custombentofactory.com;

    root /var/www/CustomBentoFactory.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.custombentofactory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.custombentofactory.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # RFQ & Sourcing Inquiries API Service (Reverse Proxy to Port 8012)
    location /api/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Clean URL handling for all core, category, and detail pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Allow validation tokens over HTTP/HTTPS
    location /.well-known/ {
        root /var/www/CustomBentoFactory.com;
    }

    # AI & Search Discovery Endpoints (UTF-8 Plain Text & JSON)
    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin '*' always;
    }

    location ~* ^/sitemap.*\.xml$ {
        default_type text/xml;
        charset utf-8;
    }

    location ~* ^/.*\.txt$ {
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin '*' always;
    }

    location /ai/ {
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        expires 30d;
        add_header Cache-Control 'public, no-transform';
    }

    # Security headers
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header X-XSS-Protection '1; mode=block' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
}
